# Firebase App Hosting configuration for Lapis Suites (fullstack_web)
# Environment variables and secrets are configured in the Firebase Console
# (or Cloud Secret Manager) so no credentials are stored in git.

runConfig:
  cpu: 1
  memoryMiB: 512
  concurrency: 80
  minInstances: 0
  maxInstances: 4

scripts:
  buildCommand: npm run build
  runCommand: npm start
