version: '3.8'

services:
  app:
    build: .
    container_name: lapissuites-app
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MONGODB_URI=mongodb://mongo:27017/propmanager
      - JWT_SECRET=lapis_suites_super_secret_jwt_key_2026_prod
      - NODE_ENV=production
    depends_on:
      - mongo
    volumes:
      - ./logs:/app/logs

  mongo:
    image: mongo:7.0
    container_name: lapissuites-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
